{% extends "admin/base.html" %}

{% block title %}Telegram Forwarder Admin{% endblock %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}" class="tf-brand">
        <span class="tf-logo">T</span>
        <span class="tf-brand-text">
            <strong>Telegram Forwarder</strong>
            <small>Administration</small>
        </span>
    </a>

    <a href="{% url 'admin_monitoring_dashboard' %}" class="tf-monitoring">
        Monitoring
    </a>
</div>
{% endblock %}

{% block extrastyle %}
{{ block.super }}

<style>
/* =========================================================
   TELEGRAM FORWARDER — DJANGO ADMIN THEME
   Uses Django's native light/dark theme system.
========================================================= */

:root {
    --primary: #2563eb;
    --secondary: #1d4ed8;
    --accent: #2563eb;
    --primary-fg: #ffffff;

    --body-fg: #334155;
    --body-bg: #f4f7fb;
    --body-quiet-color: #64748b;
    --body-loud-color: #111827;

    --header-color: #111827;
    --header-branding-color: #111827;
    --header-bg: #ffffff;

    --link-fg: #2563eb;
    --link-hover-color: #1d4ed8;
    --link-selected-fg: #1d4ed8;

    --hairline-color: #e2e8f0;
    --border-color: #cbd5e1;

    --darkened-bg: #f8fafc;
    --selected-bg: #eff6ff;

    --button-fg: #ffffff;
    --button-bg: #2563eb;
    --button-hover-bg: #1d4ed8;

    --close-button-bg: #64748b;
    --close-button-hover-bg: #475569;

    --default-button-bg: #2563eb;
    --default-button-hover-bg: #1d4ed8;

    --delete-button-bg: #dc2626;
    --delete-button-hover-bg: #b91c1c;
}


/* =========================================================
   DARK MODE
   Django sets html[data-theme="dark"] when dark mode is active.
========================================================= */

html[data-theme="dark"] {
    --primary: #60a5fa;
    --secondary: #3b82f6;
    --accent: #60a5fa;
    --primary-fg: #0f172a;

    --body-fg: #d1d5db;
    --body-bg: #0f172a;
    --body-quiet-color: #94a3b8;
    --body-loud-color: #f8fafc;

    --header-color: #f8fafc;
    --header-branding-color: #f8fafc;
    --header-bg: #111827;

    --link-fg: #60a5fa;
    --link-hover-color: #93c5fd;
    --link-selected-fg: #93c5fd;

    --hairline-color: #334155;
    --border-color: #475569;

    --darkened-bg: #1e293b;
    --selected-bg: #1e3a5f;

    --button-fg: #ffffff;
    --button-bg: #2563eb;
    --button-hover-bg: #3b82f6;

    --close-button-bg: #475569;
    --close-button-hover-bg: #64748b;

    --default-button-bg: #2563eb;
    --default-button-hover-bg: #3b82f6;

    --delete-button-bg: #dc2626;
    --delete-button-hover-bg: #ef4444;
}


/* =========================================================
   BRAND
========================================================= */

#header {
    min-height: 72px;
    padding: 0 32px;
    box-sizing: border-box;
    border-bottom: 1px solid var(--hairline-color);
    box-shadow: 0 2px 12px rgba(15, 23, 42, 0.06);
}

#branding {
    display: flex;
    align-items: center;
}

#site-name {
    display: flex;
    align-items: center;
    gap: 28px;
}

.tf-brand {
    display: flex !important;
    align-items: center;
    gap: 12px;
    text-decoration: none !important;
    color: var(--header-branding-color) !important;
}

.tf-brand:hover {
    color: var(--link-fg) !important;
}

.tf-logo {
    width: 44px;
    height: 44px;
    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(
        135deg,
        #3b82f6,
        #2563eb
    );

    color: white !important;

    font-size: 23px;
    font-weight: 800;

    box-shadow:
        0 5px 15px rgba(37, 99, 235, 0.28);
}

.tf-brand-text strong {
    display: block;
    font-size: 20px;
    line-height: 1.1;
    font-weight: 800;
}

.tf-brand-text small {
    display: block;
    margin-top: 4px;

    color: var(--body-quiet-color);

    font-size: 12px;
    font-weight: 600;
}


/* =========================================================
   MONITORING BUTTON
========================================================= */

.tf-monitoring {
    display: inline-flex !important;
    align-items: center;

    padding: 9px 17px;

    border-radius: 11px;

    background: var(--selected-bg);
    border: 1px solid var(--link-fg);

    color: var(--link-fg) !important;

    text-decoration: none !important;

    font-size: 14px;
    font-weight: 700;

    transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
}

.tf-monitoring:hover {
    background: var(--link-fg);
    color: var(--primary-fg) !important;
    transform: translateY(-1px);
}


/* =========================================================
   USER TOOLS
========================================================= */

#user-tools {
    color: var(--body-quiet-color) !important;
}

#user-tools a {
    color: var(--link-fg) !important;
}

#user-tools a:hover {
    color: var(--link-hover-color) !important;
}


/* =========================================================
   PAGE
========================================================= */

#content {
    max-width: 1500px;
    margin: 0 auto;
    padding: 32px !important;
}

.breadcrumbs {
    background: transparent !important;
    color: var(--body-quiet-color) !important;
}

.breadcrumbs a {
    color: var(--link-fg) !important;
}


/* =========================================================
   MODULE CARDS
========================================================= */

.module {
    border-radius: 16px !important;
    overflow: hidden;

    border: 1px solid var(--hairline-color) !important;

    box-shadow:
        0 4px 18px rgba(15, 23, 42, 0.06) !important;
}

.module caption,
.module h2 {
    padding: 18px 20px !important;

    color: var(--body-loud-color) !important;

    font-size: 16px !important;
    font-weight: 800 !important;
}

.module caption a {
    color: var(--body-loud-color) !important;
}

.module th,
.module td {
    border-bottom: 1px solid var(--hairline-color) !important;
}

.module th {
    color: var(--body-loud-color) !important;
}

.module td {
    color: var(--body-fg) !important;
}

.module td a {
    color: var(--link-fg) !important;
    font-weight: 600;
}


/* =========================================================
   CHANGE LIST
========================================================= */

#changelist {
    background: transparent !important;
}

#changelist-filter {
    border-radius: 14px;
    overflow: hidden;

    border: 1px solid var(--hairline-color);
}

#changelist-filter h2 {
    color: var(--body-loud-color) !important;
}

#changelist-filter h3 {
    color: var(--body-loud-color) !important;
}

#changelist-filter a {
    color: var(--link-fg) !important;
}

#changelist-form .results {
    border-radius: 14px;
    overflow: hidden;

    border: 1px solid var(--hairline-color);
}


/* =========================================================
   FORMS
========================================================= */

input,
textarea,
select {
    border-radius: 8px !important;
}

input:focus,
textarea:focus,
select:focus {
    border-color: var(--primary) !important;

    box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.15) !important;

    outline: none !important;
}


/* =========================================================
   BUTTONS
========================================================= */

.button,
input[type="submit"],
.submit-row input,
a.button {
    border-radius: 9px !important;
    font-weight: 700 !important;
}

.object-tools a {
    border-radius: 9px !important;
    font-weight: 700 !important;
}


/* =========================================================
   ACTIONS
========================================================= */

.actions {
    border-radius: 10px;
}


/* =========================================================
   FOOTER
========================================================= */

#footer {
    color: var(--body-quiet-color) !important;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 800px) {

    #header {
        padding: 12px 18px;
        min-height: auto;
    }

    #content {
        padding: 20px !important;
    }

    #site-name {
        gap: 12px;
    }

    .tf-monitoring {
        display: none !important;
    }

    .tf-brand-text strong {
        font-size: 17px;
    }

    .tf-logo {
        width: 40px;
        height: 40px;
    }
}
</style>
{% endblock %}
