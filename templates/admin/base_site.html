{% extends "admin/base.html" %}

{% block title %}Telegram Forwarder Admin{% endblock %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}" class="admin-brand">
        <span class="admin-logo">T</span>
        <span>
            <strong>Telegram Forwarder</strong>
            <small>Administration</small>
        </span>
    </a>

    <a href="{% url 'admin_monitoring_dashboard' %}" class="monitoring-link">
        Monitoring
    </a>
</div>
{% endblock %}

{% block extrastyle %}
{{ block.super }}

<style>
    /* ================================
       TELEGRAM FORWARDER ADMIN
    ================================= */

    :root {
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --dark: #111827;
        --text: #374151;
        --muted: #64748b;
        --background: #f4f7fb;
        --card: #ffffff;
        --border: #e2e8f0;
    }

    body {
        background: var(--background) !important;
        color: var(--text);
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Helvetica,
            Arial,
            sans-serif !important;
    }

    /* Header */

    #header {
        background: #ffffff !important;
        color: var(--dark) !important;
        border-bottom: 1px solid var(--border);
        min-height: 72px;
        padding: 0 32px;
        display: flex;
        align-items: center;
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
    }

    #branding {
        display: flex;
        align-items: center;
    }

    #site-name {
        display: flex;
        align-items: center;
        gap: 28px;
    }

    .admin-brand {
        display: flex !important;
        align-items: center;
        gap: 12px;
        text-decoration: none !important;
        color: var(--dark) !important;
    }

    .admin-brand:hover {
        color: var(--primary) !important;
    }

    .admin-brand strong {
        display: block;
        font-size: 20px;
        font-weight: 800;
        line-height: 1.1;
    }

    .admin-brand small {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
    }

    .admin-logo {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 800;
        box-shadow: 0 5px 14px rgba(37, 99, 235, 0.25);
    }

    .monitoring-link {
        background: #eff6ff;
        color: var(--primary) !important;
        border: 1px solid #bfdbfe;
        border-radius: 10px;
        padding: 9px 16px;
        text-decoration: none !important;
        font-weight: 700;
        font-size: 13px;
        transition: 0.2s ease;
    }

    .monitoring-link:hover {
        background: var(--primary);
        color: white !important;
        border-color: var(--primary);
    }

    #user-tools {
        color: var(--muted) !important;
        font-size: 13px;
    }

    #user-tools a {
        color: var(--primary) !important;
        font-weight: 600;
    }

    /* Main */

    #content {
        padding: 32px !important;
        max-width: 1500px;
        margin: 0 auto;
    }

    #content-main {
        width: 100% !important;
    }

    .breadcrumbs {
        background: transparent !important;
        padding: 0 0 20px !important;
        color: var(--muted) !important;
        font-size: 13px;
    }

    .breadcrumbs a {
        color: var(--primary) !important;
    }

    /* Dashboard modules */

    .module {
        background: var(--card) !important;
        border: 1px solid var(--border) !important;
        border-radius: 16px !important;
        overflow: hidden;
        box-shadow:
            0 4px 15px rgba(15, 23, 42, 0.04) !important;
        margin-bottom: 24px !important;
    }

    .module caption,
    .module h2 {
        background: #ffffff !important;
        color: var(--dark) !important;
        border-bottom: 1px solid var(--border);
        padding: 18px 20px !important;
        font-size: 16px !important;
        font-weight: 800 !important;
    }

    .module caption a {
        color: var(--dark) !important;
    }

    .module table {
        border-collapse: collapse;
    }

    .module th,
    .module td {
        border-bottom: 1px solid #eef2f7 !important;
        padding: 14px 18px !important;
    }

    .module tr:last-child th,
    .module tr:last-child td {
        border-bottom: none !important;
    }

    .module th {
        color: var(--dark);
        font-weight: 700;
    }

    .module td {
        color: var(--muted);
    }

    .module td a {
        color: var(--primary) !important;
        font-weight: 600;
    }

    /* Buttons */

    input[type="submit"],
    .submit-row input,
    .button,
    a.button {
        border-radius: 9px !important;
        font-weight: 700 !important;
        padding: 10px 18px !important;
        border: none !important;
    }

    input[type="submit"],
    .submit-row input.default {
        background: var(--primary) !important;
    }

    input[type="submit"]:hover,
    .submit-row input.default:hover {
        background: var(--primary-dark) !important;
    }

    .button,
    a.button {
        background: #eef2ff !important;
        color: var(--primary) !important;
    }

    /* Forms */

    input,
    textarea,
    select {
        border: 1px solid #cbd5e1 !important;
        border-radius: 8px !important;
        padding: 9px 11px !important;
    }

    input:focus,
    textarea:focus,
    select:focus {
        border-color: var(--primary) !important;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12) !important;
        outline: none !important;
    }

    /* Change list */

    #changelist {
        background: transparent !important;
    }

    #changelist-filter {
        background: white !important;
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
    }

    #changelist-filter h2 {
        background: #f8fafc !important;
        color: var(--dark) !important;
        padding: 14px 16px;
    }

    #changelist-filter h3 {
        color: var(--dark);
        font-weight: 700;
    }

    #changelist-filter a {
        color: var(--primary) !important;
    }

    #changelist-form .results {
        background: white;
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
    }

    #changelist table thead th {
        background: #f8fafc !important;
        color: var(--dark) !important;
    }

    #changelist table tbody tr:hover {
        background: #f8fbff !important;
    }

    /* Object tools */

    .object-tools a {
        background: var(--primary) !important;
        border-radius: 9px !important;
        font-weight: 700 !important;
        padding: 9px 15px !important;
    }

    .object-tools a:hover {
        background: var(--primary-dark) !important;
    }

    /* Messages */

    .messagelist {
        margin: 0 0 24px !important;
    }

    .messagelist li {
        border-radius: 10px !important;
        padding: 13px 16px !important;
    }

    /* Footer */

    #footer {
        margin-top: 30px;
        padding: 20px;
        color: var(--muted);
        text-align: center;
    }

    /* Responsive */

    @media (max-width: 800px) {
        #header {
            padding: 12px 18px;
            min-height: auto;
        }

        #content {
            padding: 20px !important;
        }

        #site-name {
            gap: 12px;
        }

        .monitoring-link {
            display: none;
        }

        .admin-brand strong {
            font-size: 16px;
        }

        #user-tools {
            font-size: 11px;
        }
    }
</style>
{% endblock %}
