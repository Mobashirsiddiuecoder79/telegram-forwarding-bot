{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Telegram Forwarder</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">

            <div class="auth-logo">T</div>

            <h1 class="auth-title">Forgot Password?</h1>

            <p class="auth-description">
                Enter the email address associated with your account.
                We'll send you a secure password reset link.
            </p>

            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label class="form-label" for="id_email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        name="email"
                        id="id_email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                        autofocus
                    >
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Send Reset Link
                </button>
            </form>

            <p style="margin-top: 22px; text-align: center; font-size: 14px;">
                <a href="{% url 'login' %}" style="color: var(--primary); font-weight: 700;">
                    ← Back to Login
                </a>
            </p>

        </div>
    </div>
</div>

</body>
</html>
