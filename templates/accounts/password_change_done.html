<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Updated | Telegram Forwarder</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            background: #f3f6fc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #172033;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            border: 1px solid #e5eaf2;
            border-radius: 24px;
            padding: 48px 42px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(30, 55, 100, 0.10);
        }

        .icon {
            width: 76px;
            height: 76px;
            margin: 0 auto 24px;
            border-radius: 22px;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 12px 28px rgba(37, 99, 235, 0.25);
        }

        h1 {
            font-size: 30px;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .message {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .success-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 28px;
            color: #166534;
            font-size: 14px;
            font-weight: 600;
        }

        .button {
            display: block;
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: 700;
            transition: 0.2s ease;
        }

        .button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .secondary {
            display: block;
            margin-top: 16px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .secondary:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 30px;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">
        ✓
    </div>

    <h1>Password Updated</h1>

    <p class="message">
        Your password has been changed successfully.
        Your account is now protected with your new password.
    </p>

    <div class="success-box">
        ✓ Your password was updated successfully.
    </div>

    <a href="{% url 'profile' %}" class="button">
        Back to Profile
    </a>

    <a href="{% url 'home' %}" class="secondary">
        ← Back to Dashboard
    </a>

    <div class="footer">
        Telegram Forwarder · Account Security
    </div>

</div>

</body>
</html>
