{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Telegram Forwarder</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">

            <div class="auth-logo">T</div>

            <h1 class="auth-title">Welcome Back</h1>

            <p class="auth-description">
                Sign in to manage your Telegram forwarding service.
            </p>

            {% if form.errors %}
                <div class="alert alert-error">
                    Username or password is incorrect.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label class="form-label" for="id_username">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        id="id_username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="id_password">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        id="id_password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <input type="hidden" name="next" value="{{ next }}">

                <div style="text-align: right; margin: -6px 0 18px;">
                    <a href="{% url 'password_reset' %}"
                       style="color: var(--primary); font-size: 13px; font-weight: 700;">
                        Forgot Password?
                    </a>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Login
                </button>
            </form>

            <p style="margin-top: 22px; text-align: center; color: var(--text-muted); font-size: 14px;">
                Don't have an account?
                <a href="{% url 'register' %}" style="color: var(--primary); font-weight: 700;">
                    Create Account
                </a>
            </p>

        </div>
    </div>
</div>

</body>
</html>
